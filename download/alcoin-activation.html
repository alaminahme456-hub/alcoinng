<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALCOIN Activation</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Orbitron:wght@400;500;600;700;800;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050a08;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
  }

  .scene {
    width: 390px;
    height: 693px; /* 9:16 */
    background: radial-gradient(ellipse at 50% 30%, #0a1f15 0%, #050a08 60%, #020504 100%);
    position: relative;
    overflow: hidden;
    border-radius: 24px;
    box-shadow: 0 0 80px rgba(212, 175, 55, 0.08);
  }

  /* ── Canvas Particles ── */
  #particles {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* ── Light Streaks ── */
  .streak {
    position: absolute;
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.3), transparent);
    opacity: 0;
    z-index: 1;
    filter: blur(1px);
  }
  .streak-1 { top: 15%; left: -200px; transform: rotate(-25deg); animation: streakMove 4s ease-in-out 0.5s infinite; }
  .streak-2 { top: 35%; left: -200px; transform: rotate(-15deg); animation: streakMove 5s ease-in-out 1.5s infinite; }
  .streak-3 { top: 60%; left: -200px; transform: rotate(-30deg); animation: streakMove 6s ease-in-out 3s infinite; }
  .streak-4 { top: 80%; left: -200px; transform: rotate(-20deg); animation: streakMove 4.5s ease-in-out 2s infinite; }

  @keyframes streakMove {
    0%   { left: -200px; opacity: 0; }
    20%  { opacity: 0.6; }
    80%  { opacity: 0.6; }
    100% { left: 600px; opacity: 0; }
  }

  /* ── Content Container ── */
  .content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 40px 28px;
  }

  /* ── Phase 1: Logo ── */
  .logo-phase {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .logo-phase.visible {
    opacity: 1;
    transform: scale(1);
  }
  .logo-phase.exit {
    opacity: 0;
    transform: scale(0.6) translateY(-30px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .logo-icon {
    width: 72px;
    height: 72px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo-icon svg {
    width: 72px;
    height: 72px;
    filter: drop-shadow(0 0 20px rgba(212,175,55,0.5));
  }
  .logo-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 8px;
    color: #d4af37;
    text-shadow: 0 0 30px rgba(212,175,55,0.4), 0 0 60px rgba(212,175,55,0.15);
  }
  .logo-tagline {
    font-size: 11px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(212,175,55,0.5);
    font-weight: 400;
    margin-top: -4px;
  }

  /* ── Phase 2: Verification Card ── */
  .verification-phase {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    opacity: 0;
    transform: translateY(40px) scale(0.95);
    transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1);
    width: 100%;
    pointer-events: none;
  }
  .verification-phase.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .verification-phase.exit {
    opacity: 0;
    transform: translateY(-30px) scale(0.95);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }

  .glass-card {
    width: 100%;
    max-width: 340px;
    background: rgba(15, 35, 25, 0.6);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);
    border: 1px solid rgba(212,175,55,0.12);
    border-radius: 24px;
    padding: 36px 28px 32px;
    box-shadow:
      0 0 40px rgba(212,175,55,0.06),
      0 25px 50px rgba(0,0,0,0.4),
      inset 0 1px 0 rgba(255,255,255,0.04);
    position: relative;
    overflow: visible;
  }
  .glass-card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 24px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(212,175,55,0.2), transparent 40%, transparent 60%, rgba(212,175,55,0.1));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }

  .card-header {
    text-align: center;
    margin-bottom: 28px;
  }
  .card-icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 16px;
    background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(212,175,55,0.2);
  }
  .card-icon svg {
    width: 24px;
    height: 24px;
    stroke: #d4af37;
  }
  .card-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #f0e6d0;
    letter-spacing: 1px;
    line-height: 1.4;
  }
  .card-subtitle {
    font-size: 12px;
    color: rgba(240,230,208,0.4);
    margin-top: 8px;
    line-height: 1.5;
    font-weight: 300;
  }

  /* ── Code Boxes ── */
  .code-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    position: relative;
    margin: 4px 0 24px;
  }

  .code-box {
    width: 44px;
    height: 54px;
    background: rgba(10, 25, 18, 0.8);
    border: 1.5px solid rgba(212,175,55,0.15);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: transparent;
    position: relative;
    transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    overflow: hidden;
  }
  .code-box.filled {
    color: #d4af37;
    border-color: rgba(212,175,55,0.4);
    background: rgba(212,175,55,0.06);
    text-shadow: 0 0 12px rgba(212,175,55,0.5);
  }
  .code-box.filled::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 2px;
    background: rgba(212,175,55,0.3);
    border-radius: 2px;
  }
  .code-box.active {
    border-color: rgba(212,175,55,0.6);
    box-shadow: 0 0 16px rgba(212,175,55,0.15);
  }
  .code-box.success {
    border-color: #d4af37;
    box-shadow: 0 0 30px rgba(212,175,55,0.4), 0 0 60px rgba(212,175,55,0.15);
    background: rgba(212,175,55,0.12);
    color: #d4af37;
    animation: boxSuccess 0.6s ease;
  }

  @keyframes boxSuccess {
    0%   { transform: scale(1); }
    30%  { transform: scale(1.08); }
    60%  { transform: scale(0.97); }
    100% { transform: scale(1); }
  }

  /* ── Digit Pop Animation ── */
  .code-box.pop .digit {
    animation: digitPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes digitPop {
    0%   { transform: scale(0) translateY(10px); opacity: 0; }
    60%  { transform: scale(1.15) translateY(-2px); opacity: 1; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* ── Rotating Ring ── */
  .ring-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 320px;
    height: 80px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  .ring-container.visible { opacity: 1; }

  .ring {
    width: 100%;
    height: 100%;
    border: 1.5px solid transparent;
    border-top-color: rgba(212,175,55,0.3);
    border-radius: 50%;
    animation: ringRotate 3s linear infinite;
    position: relative;
  }
  .ring::before {
    content: '';
    position: absolute;
    top: -3px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    background: #d4af37;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(212,175,55,0.6);
  }
  .ring-2 {
    position: absolute;
    inset: -8px;
    border: 1px solid transparent;
    border-bottom-color: rgba(212,175,55,0.15);
    border-radius: 50%;
    animation: ringRotateReverse 4s linear infinite;
  }
  .ring-2::before {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    background: rgba(212,175,55,0.5);
    border-radius: 50%;
    box-shadow: 0 0 8px rgba(212,175,55,0.4);
  }

  @keyframes ringRotate { to { transform: rotate(360deg); } }
  @keyframes ringRotateReverse { to { transform: rotate(-360deg); } }

  /* ── Ring to Checkmark Transition ── */
  .ring-container.verifying .ring {
    animation: ringAccelerate 0.8s cubic-bezier(0.4,0,0.2,1) forwards;
    border-top-color: #d4af37;
  }
  .ring-container.verifying .ring-2 {
    animation: ringAccelerate 0.8s cubic-bezier(0.4,0,0.2,1) forwards;
    border-bottom-color: rgba(212,175,55,0.4);
  }
  @keyframes ringAccelerate {
    0%   { transform: rotate(0deg) scale(1); opacity: 1; }
    50%  { transform: rotate(540deg) scale(1.15); opacity: 1; }
    100% { transform: rotate(720deg) scale(0.3); opacity: 0; }
  }

  /* ── Checkmark ── */
  .checkmark-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .checkmark-container.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
  .checkmark-circle {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.08));
    border: 2px solid #d4af37;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 40px rgba(212,175,55,0.3), 0 0 80px rgba(212,175,55,0.1);
  animation: checkPulse 2s ease-in-out infinite;
  }
  @keyframes checkPulse {
    0%, 100% { box-shadow: 0 0 40px rgba(212,175,55,0.3), 0 0 80px rgba(212,175,55,0.1); }
    50% { box-shadow: 0 0 50px rgba(212,175,55,0.4), 0 0 100px rgba(212,175,55,0.15); }
  }
  .checkmark-svg {
    width: 28px;
    height: 28px;
  }
  .checkmark-path {
    stroke: #d4af37;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
  }
  .checkmark-container.visible .checkmark-path {
    animation: drawCheck 0.5s 0.2s ease forwards;
  }
  @keyframes drawCheck {
    to { stroke-dashoffset: 0; }
  }

  /* ── Phase 3: Success ── */
  .success-phase {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.8s ease, transform 0.8s ease;
    position: absolute;
    width: 100%;
    padding: 0 28px;
  }
  .success-phase.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .success-badge {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
    border: 2px solid rgba(212,175,55,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 40px rgba(212,175,55,0.2);
    animation: successBreathe 2s ease-in-out infinite;
  }
  @keyframes successBreathe {
    0%, 100% { box-shadow: 0 0 40px rgba(212,175,55,0.2); transform: scale(1); }
    50% { box-shadow: 0 0 60px rgba(212,175,55,0.3); transform: scale(1.03); }
  }
  .success-badge svg {
    width: 36px;
    height: 36px;
  }
  .success-badge .check-path {
    stroke: #d4af37;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: drawCheckFinal 0.6s 0.3s ease forwards;
  }
  @keyframes drawCheckFinal {
    to { stroke-dashoffset: 0; }
  }
  .success-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: #d4af37;
    text-shadow: 0 0 30px rgba(212,175,55,0.3);
    letter-spacing: 2px;
    text-align: center;
  }
  .success-subtitle {
    font-size: 14px;
    color: rgba(240,230,208,0.5);
    font-weight: 300;
    letter-spacing: 1px;
    text-align: center;
  }
  .success-logo {
    margin-top: 16px;
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 6px;
    color: #d4af37;
    text-shadow: 0 0 40px rgba(212,175,55,0.3);
  }
  .success-dash-preview {
    width: 100%;
    max-width: 300px;
    margin-top: 12px;
    background: rgba(15, 35, 25, 0.5);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(212,175,55,0.1);
    border-radius: 16px;
    padding: 20px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.8s ease 0.3s, transform 0.8s ease 0.3s;
  }
  .success-phase.visible .success-dash-preview {
    opacity: 1;
    transform: translateY(0);
  }
  .dash-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(212,175,55,0.06);
  }
  .dash-row:last-child { border-bottom: none; }
  .dash-label {
    font-size: 11px;
    color: rgba(240,230,208,0.35);
    font-weight: 400;
  }
  .dash-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    color: rgba(212,175,55,0.8);
    font-weight: 600;
  }
  .dash-value.green { color: #4ade80; }

  /* ── Ambient Glow ── */
  .ambient-glow {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(212,175,55,0.08), transparent 70%);
    pointer-events: none;
    z-index: 0;
    animation: ambientFloat 6s ease-in-out infinite;
  }
  .glow-1 { top: -60px; right: -40px; animation-delay: 0s; }
  .glow-2 { bottom: -80px; left: -60px; animation-delay: 2s; }
  .glow-3 { top: 40%; left: 50%; transform: translateX(-50%); width: 300px; height: 300px; opacity: 0.3; }

  @keyframes ambientFloat {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(10px, -10px); }
  }

  /* ── Shimmer on glass card ── */
  .glass-card .shimmer {
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.03), transparent);
    animation: shimmer 4s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%   { left: -100%; }
    50%  { left: 150%; }
    100% { left: 150%; }
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <!-- Ambient glows -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <!-- Light streaks -->
  <div class="streak streak-1"></div>
  <div class="streak streak-2"></div>
  <div class="streak streak-3"></div>
  <div class="streak streak-4"></div>

  <!-- Particles canvas -->
  <canvas id="particles"></canvas>

  <!-- Content -->
  <div class="content">

    <!-- Phase 1: Logo -->
    <div class="logo-phase" id="logoPhase">
      <div class="logo-icon">
        <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="36" cy="36" r="30" stroke="#d4af37" stroke-width="2" opacity="0.3"/>
          <circle cx="36" cy="36" r="22" stroke="#d4af37" stroke-width="1.5" opacity="0.2"/>
          <path d="M36 16 L36 56" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
          <path d="M36 28 L48 22" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
          <path d="M36 38 L24 44" stroke="#d4af37" stroke-width="2" stroke-linecap="round"/>
          <circle cx="36" cy="36" r="4" fill="#d4af37" opacity="0.6"/>
        </svg>
      </div>
      <div class="logo-text">ALCOIN</div>
      <div class="logo-tagline">Digital Finance</div>
    </div>

    <!-- Phase 2: Verification -->
    <div class="verification-phase" id="verificationPhase">
      <div class="glass-card" id="glassCard">
        <div class="shimmer"></div>

        <div class="card-header">
          <div class="card-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <div class="card-title">Activate Your<br>ALCOIN Account</div>
          <div class="card-subtitle">Enter your activation code to unlock your account.</div>
        </div>

        <div style="position:relative;">
          <div class="code-row" id="codeRow">
            <div class="code-box" id="box0"><span class="digit"></span></div>
            <div class="code-box" id="box1"><span class="digit"></span></div>
            <div class="code-box" id="box2"><span class="digit"></span></div>
            <div class="code-box" id="box3"><span class="digit"></span></div>
            <div class="code-box" id="box4"><span class="digit"></span></div>
            <div class="code-box" id="box5"><span class="digit"></span></div>
          </div>
          <div class="ring-container" id="ringContainer">
            <div class="ring"></div>
            <div class="ring-2"></div>
          </div>
          <div class="checkmark-container" id="checkmarkContainer">
            <div class="checkmark-circle">
              <svg class="checkmark-svg" viewBox="0 0 24 24">
                <path class="checkmark-path" d="M5 13l4 4L19 7"/>
              </svg>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Phase 3: Success -->
    <div class="success-phase" id="successPhase">
      <div class="success-badge">
        <svg viewBox="0 0 24 24">
          <path class="check-path" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <div class="success-title">Activation Successful</div>
      <div class="success-subtitle">Welcome to ALCOIN</div>
      <div class="success-logo">ALCOIN</div>
      <div class="success-dash-preview">
        <div class="dash-row">
          <span class="dash-label">Portfolio Value</span>
          <span class="dash-value">$12,480.00</span>
        </div>
        <div class="dash-row">
          <span class="dash-label">Today's P&L</span>
          <span class="dash-value green">+$342.50</span>
        </div>
        <div class="dash-row">
          <span class="dash-label">Status</span>
          <span class="dash-value">Active</span>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// ── Particle System ──
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
const scene = document.getElementById('scene');

function resizeCanvas() {
  canvas.width = scene.offsetWidth;
  canvas.height = scene.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 1.5 + 0.5;
    this.speedX = (Math.random() - 0.5) * 0.3;
    this.speedY = (Math.random() - 0.5) * 0.3;
    this.opacity = Math.random() * 0.4 + 0.1;
    this.life = Math.random() * 200 + 100;
    this.maxLife = this.life;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    this.life--;
    if (this.life <= 0 || this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
      this.reset();
    }
  }
  draw() {
    const fade = Math.min(this.life / 30, (this.maxLife - this.life) / 30, 1);
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(212, 175, 55, ' + (this.opacity * fade) + ')';
    ctx.fill();
  }
}

const particles = Array.from({ length: 40 }, () => new Particle());

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ── Animation Sequence ──
const CODE = ['A', 'L', 'C', 'N', '0', '1'];

function delay(ms) {
  return new Promise(r => setTimeout(r, ms));
}

async function runAnimation() {
  const logoPhase = document.getElementById('logoPhase');
  const verificationPhase = document.getElementById('verificationPhase');
  const successPhase = document.getElementById('successPhase');
  const ringContainer = document.getElementById('ringContainer');
  const checkmarkContainer = document.getElementById('checkmarkContainer');

  // Phase 1: Logo (0 - 1.8s)
  await delay(200);
  logoPhase.classList.add('visible');
  await delay(1800);

  // Transition: Logo exits
  logoPhase.classList.add('exit');
  await delay(600);
  logoPhase.style.display = 'none';

  // Phase 2: Verification card enters
  verificationPhase.classList.add('visible');
  await delay(800);

  // Show ring
  ringContainer.classList.add('visible');
  await delay(400);

  // Type code one digit at a time
  for (let i = 0; i < CODE.length; i++) {
    const box = document.getElementById('box' + i);
    const digit = box.querySelector('.digit');

    box.classList.add('active');
    await delay(150);

    digit.textContent = CODE[i];
    box.classList.add('filled', 'pop');
    await delay(100);
    box.classList.remove('active', 'pop');

    if (i < CODE.length - 1) {
      await delay(250);
    }
  }

  await delay(300);

  // All boxes glow gold
  for (let i = 0; i < CODE.length; i++) {
    document.getElementById('box' + i).classList.add('success');
  }
  await delay(500);

  // Ring accelerates → checkmark
  ringContainer.classList.add('verifying');
  await delay(800);
  ringContainer.style.display = 'none';

  checkmarkContainer.classList.add('visible');
  await delay(800);

  // Transition to success
  verificationPhase.classList.add('exit');
  await delay(600);
  verificationPhase.style.display = 'none';

  successPhase.classList.add('visible');
}

// Start on load
window.addEventListener('load', () => {
  setTimeout(runAnimation, 500);
});
</script>
